<script>
const msgs=["Te amo ❤️", "Eres lo más lindo que tengo", "Gracias por llegar a mí", "Mi vida", "Mi mundo", "Mi alma gemela", "Mi otra mitad", "Mi futura esposa 💍", "La luz de mis ojos ✨", "Mi goidito heimoso 🥹", "Mi amoi", "Mi bebé grandote ❤️", "Mi lugar seguro", "Mi persona favorita", "Mi hogar", "Mi todo", "Y podría seguir diciéndote mil cosas…", "Te elegiría una y mil veces más. ❤️"];
const positions=[[14,27],[58,25],[28,34],[66,40],[9,47],[48,47],[73,53],[22,57],[57,59],[7,66],[68,68],[34,72],[53,77],[12,82],[76,80],[30,87],[60,88],[42,94]];
let n=0,timer;
function addWord(text){const el=document.createElement('div');el.className='word';el.textContent=text;const p=positions[n%positions.length];el.style.left=p[0]+'%';el.style.top=p[1]+'%';document.getElementById('words').appendChild(el);setTimeout(()=>el.remove(),4300);n++;}
document.getElementById('go').onclick=()=>{document.getElementById('start').remove();addWord(msgs[0]);let i=1;timer=setInterval(()=>{if(i>=msgs.length){clearInterval(timer);return}addWord(msgs[i++])},1500)};
